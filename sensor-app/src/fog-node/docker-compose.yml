version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    restart: unless-stopped

  fog-node:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MQTT_BROKER_URL=mqtt://host.docker.internal:1883
    depends_on:
      - mosquitto
    restart: unless-stopped